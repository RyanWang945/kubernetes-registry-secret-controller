apiVersion: v1
kind: Namespace
metadata:
  name: registry-secret-controller-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-secret-controller
  namespace: registry-secret-controller-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-secret-controller-perf-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["auto-patch-secret"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-secret-controller-perf-writer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["auto-patch-secret"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["default", "workload", "late-workload"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-secret-controller-perf-system
  namespace: registry-secret-controller-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["registry-secret-controller-config"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: registry-secret-controller-perf-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: registry-secret-controller-perf-reader
subjects:
  - kind: ServiceAccount
    name: registry-secret-controller
    namespace: registry-secret-controller-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-secret-controller-perf-system
  namespace: registry-secret-controller-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-secret-controller-perf-system
subjects:
  - kind: ServiceAccount
    name: registry-secret-controller
    namespace: registry-secret-controller-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-secret-controller-config
  namespace: registry-secret-controller-system
data:
  namespace: krsc-perf-sentinel
  serviceaccount: default,workload
  registries: |
    - regionID: mock-region
      instanceID: mock-registry
      accessKeyID: mock-access-key
      accessKeySecret: mock-access-secret
      domains:
        - registry.mock.example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-secret-controller-perf
  namespace: registry-secret-controller-system
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-secret-controller-perf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-secret-controller-perf
    spec:
      serviceAccountName: registry-secret-controller
      terminationGracePeriodSeconds: 10
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      containers:
        - name: controller
          image: docker.io/library/kubernetes-registry-secret-controller:perf-tuned
          imagePullPolicy: Never
          args:
            - --allow-mock-provider
            - --leader-elect=true
            - --mock-token-ttl=1h
            - --credential-refresh-before=10m
            - --mock-clock-control-address=:8082
            - --kube-api-qps=25
            - --kube-api-burst=50
            - --max-concurrent-namespace-reconciles=8
            - --max-concurrent-service-account-reconciles=8
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: clock
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1500m"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: registry-secret-controller-perf-clock
  namespace: registry-secret-controller-system
spec:
  selector:
    app.kubernetes.io/name: registry-secret-controller-perf
  ports:
    - name: clock
      port: 8082
      targetPort: clock
