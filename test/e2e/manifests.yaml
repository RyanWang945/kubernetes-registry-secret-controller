apiVersion: v1
kind: Namespace
metadata:
  name: registry-secret-controller-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry-secret-e2e-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry-secret-e2e-b
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry-secret-e2e-conflict
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-secret-controller
  namespace: registry-secret-controller-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-secret-controller-e2e
rules:
  - apiGroups: [""]
    resources: ["configmaps", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: registry-secret-controller-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: registry-secret-controller-e2e
subjects:
  - kind: ServiceAccount
    name: registry-secret-controller
    namespace: registry-secret-controller-system
---
apiVersion: v1
kind: Secret
metadata:
  name: auto-patch-secret
  namespace: registry-secret-e2e-conflict
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"unmanaged.example.com":{"username":"owner","password":"owned-elsewhere","auth":"b3duZXI6b3duZWQtZWxzZXdoZXJl"}}}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-secret-controller-config
  namespace: registry-secret-controller-system
data:
  namespace: registry-secret-e2e-a,registry-secret-e2e-b,registry-secret-e2e-conflict
  serviceaccount: default
  registries: |
    - regionID: mock-region
      instanceID: mock-registry
      accessKeyID: mock-access-key
      accessKeySecret: mock-access-secret
      domains:
        - registry.mock.example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-secret-controller-e2e
  namespace: registry-secret-controller-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-secret-controller-e2e
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-secret-controller-e2e
    spec:
      serviceAccountName: registry-secret-controller
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: registry-secret-controller-e2e
              topologyKey: kubernetes.io/hostname
      containers:
        - name: controller
          image: docker.io/library/kubernetes-registry-secret-controller:e2e
          imagePullPolicy: Never
          args:
            - --allow-mock-provider
            - --leader-elect=true
            - --mock-token-ttl=30s
            - --credential-refresh-before=10s
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
